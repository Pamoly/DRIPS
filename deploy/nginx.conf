# Reverse proxy for DRIPS behind TLS.
# Place at /etc/nginx/sites-available/drips and symlink into sites-enabled.
# Obtain certificates with: certbot --nginx -d seo.example.com

upstream drips_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name seo.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seo.example.com;

    ssl_certificate     /etc/letsencrypt/live/seo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seo.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Keep public widgets embeddable: never send X-Frame-Options for /embed.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 5m;

    location /_next/static/ {
        proxy_pass http://drips_app;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://drips_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }

    location /api/health {
        proxy_pass http://drips_app;
        access_log off;
    }
}
